name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure CocoaPods is available
        run: |
          if command -v pod >/dev/null 2>&1; then
            echo "CocoaPods is already installed: $(pod --version)"
          else
            brew install cocoapods
          fi

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install

      - name: List workspace info
        run: |
          cd ios
          echo "=== Files ==="
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "=== Workspace: $WORKSPACE ==="
          xcodebuild -workspace "$WORKSPACE" -list

      - name: Build iOS app (unsigned, real device)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Find .app and package IPA
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | grep -v "\.app/" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found anywhere in ios/build"
            find ios/build -type f | head -50
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r UlsuNotSmart.ipa Payload
          ls -lh UlsuNotSmart.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UlsuNotSmart-iOS
          path: UlsuNotSmart.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UlsuNotSmart.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
