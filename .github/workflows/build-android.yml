name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and prepare APKs for release
        run: |
          RELEASE_DIR="$GITHUB_WORKSPACE/release-apks"
          mkdir -p "$RELEASE_DIR"
          cd android/app/build/outputs/apk/release
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              dest_name=$(echo "$apk" | sed 's/^app-/UlsuNotSmart-/' | sed 's/-release\.apk$/.apk/')
              if [ "$dest_name" = "$apk" ]; then
                dest_name="UlsuNotSmart.apk"
              fi
              cp "$apk" "$RELEASE_DIR/$dest_name"
              echo "Prepared $dest_name from $apk"
            fi
          done
          if [ -f "$RELEASE_DIR/UlsuNotSmart-universal.apk" ]; then
            cp "$RELEASE_DIR/UlsuNotSmart-universal.apk" "$RELEASE_DIR/UlsuNotSmart.apk"
            echo "Created default UlsuNotSmart.apk from universal build"
          fi
          cd "$GITHUB_WORKSPACE"
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UlsuNotSmart-Android-APKs
          path: release-apks/*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
